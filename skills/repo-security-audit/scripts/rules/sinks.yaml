# 危险 API 与漏洞模式规则(数据流分析用的 sink 清单)
#
# languages 字段:[python] / [javascript] / [java] / [go] / [php] 限定语言,
#               ["*"] 表示对所有文本文件生效(通用 Web 规则走这条)。
#
# 牢记:一条命中只说明"这里有个危险的 sink",**不等于漏洞**。
# 真漏洞需要同时满足:①参数可控 ②能到达这里 ③没有拦截。后两步要靠读代码判断。
#
# 正则写在单引号里;YAML 单引号串中的单引号要写成两个('')。

rules:
  # ========================================================================= #
  # 通用 Web(不限语言 / 不限框架)
  # ========================================================================= #

  - id: WEB-CMD-INJECTION-SHELL
    category: A03:2021-Injection
    cwe: CWE-78
    severity: high
    confidence: medium
    languages: ['*']
    pattern: '(?i)(subprocess\.(run|call|Popen|check_output|check_call)[^\n]{0,120}shell\s*=\s*True|child_process\.exec\s*\(|Runtime\.getRuntime\(\)\s*\.\s*exec|\bos\.system\s*\(|\bassert\s*\(\s*\$|shell_exec|passthru|proc_open|exec\.Command\s*\(\s*["''](sh|bash|cmd|powershell)["''])'
    message: "命令执行 sink,若参数含外部输入即为 RCE"
    remediation: "用参数数组传参、不经过 shell;对可执行文件白名单,对参数做校验"

  - id: WEB-SQL-STRING-BUILD
    category: A03:2021-Injection
    cwe: CWE-89
    severity: high
    confidence: medium
    languages: ['*']
    pattern: '(?i)(select|insert\s+into|update\s+\w+\s+set|delete\s+from)[^\n;]{0,160}(\.format\s*\(|%\s*[\w(]|\$\{|f["'']|fmt\.Sprintf|["'']\s*\+\s*[a-z_$]|\+\s*["'']|["'']\s*\.\s*\$[a-z_]|\$[a-z_]+\s*\.\s*["''])'
    message: "SQL 语句用拼接 / 格式化构造(疑似注入)"
    remediation: "一律用参数化查询(占位符);表名/列名用白名单映射"

  - id: WEB-PATH-TRAVERSAL
    category: A01:2021-Broken-Access-Control
    cwe: CWE-22
    severity: high
    confidence: medium
    languages: ['*']
    pattern: '(?i)(open|readFile|readFileSync|createReadStream|sendFile|file_get_contents|fopen|readfile|new\s+File|Files\.(read|write|newInputStream)|os\.ReadFile|ioutil\.ReadFile|filepath\.Join|os\.path\.join|Path\.Combine)\s*\([^)]{0,80}(\$_(GET|POST|REQUEST|COOKIE)|request\.(args|form|params|query|body)|req\.(query|params|body)|\binput\(|params\[|getParameter|getHeader)'
    message: "文件路径由外部输入拼接(目录穿越 / 任意文件读写)"
    remediation: "规范化路径后校验是否仍在允许目录内;用 ID 映射而非用户给的文件名"

  - id: WEB-UNRESTRICTED-FILE-UPLOAD
    category: A04:2021-Insecure-Design
    cwe: CWE-434
    severity: high
    confidence: medium
    languages: ['*']
    pattern: '(?i)(move_uploaded_file\s*\(|multipart\.FormFile|\.save\s*\(\s*(file|upload)|copy\s*\(\s*\$_FILES|Files\.copy[^\n]{0,60}(MultipartFile|getOriginalFilename))'
    message: "文件上传落盘,确认是否校验扩展名 / MIME / 内容,以及落盘目录能否被执行"
    remediation: "白名单扩展名 + 重命名 + 存到 Web 根之外 + 禁止执行权限"

  - id: WEB-SSRF-REQUEST
    category: A10:2021-Server-Side-Request-Forgery
    cwe: CWE-918
    severity: medium
    confidence: low
    languages: ['*']
    pattern: '(?i)(requests\.(get|post|put|delete|request)|urlopen|http\.(Get|Post|PostForm)|axios\.(get|post|put|delete|request)|fetch\s*\(|got\(|superagent|curl_init|curl_setopt[^\n]{0,80}CURLOPT_URL|HttpURLConnection|new\s+URL\s*\(|WebClient\.(get|post))\s*\(?[^\n)]{0,80}(\$_(GET|POST|REQUEST)|request\.(args|form|params|query|body|getParameter)|req\.(query|params|body)|params\[|input\()'
    message: "请求目标由外部输入决定(SSRF 信号),确认是否有协议 / 内网地址校验"
    remediation: "目标用白名单;解析 DNS 后校验 IP 不在内网/回环/元数据段;禁用非常规 scheme"

  - id: WEB-CLOUD-METADATA
    category: A10:2021-Server-Side-Request-Forgery
    cwe: CWE-918
    severity: high
    confidence: high
    languages: ['*']
    pattern: '(?i)(169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200|metadata\.aliyun|/latest/meta-data)'
    message: "出现云元数据地址(多半是已有 SSRF 的利用面,或代码里在直连)"
    remediation: "给云主机启用 IMDSv2 / 限制元数据访问;应用层禁止访问该网段"

  - id: WEB-DESERIALIZATION
    category: A08:2021-Software-and-Data-Integrity-Failures
    cwe: CWE-502
    severity: high
    confidence: medium
    languages: ['*']
    pattern: '(?i)(pickle\.loads?|cPickle\.loads?|dill\.loads|marshal\.loads|yaml\.load\s*\(|unserialize\s*\(|ObjectInputStream|readObject\s*\(\s*\)|XMLDecoder|BinaryFormatter|JsonConvert\.DeserializeObject[^\n]{0,60}TypeNameHandling)'
    message: "反序列化 sink,输入可控时可直接达成 RCE"
    remediation: "改安全格式(JSON + 显式校验);确需反序列化则做类型白名单"

  - id: WEB-XXE
    category: A05:2021-Security-Misconfiguration
    cwe: CWE-611
    severity: high
    confidence: medium
    languages: ['*']
    pattern: '(?i)(xml\.etree\.ElementTree|etree\.(parse|fromstring|XML)|lxml\.etree[^\n]{0,80}XMLParser|simplexml_load_file|simplexml_load_string|DocumentBuilderFactory\.newInstance|SAXParserFactory\.newInstance|XmlReader\.Create|loadXML\s*\(|DOMDocument[^\n]{0,40}load)'
    message: "XML 解析入口,确认是否禁用了外部实体与 DTD"
    remediation: "关闭 DTD / 外部实体(resolve_entities=False、disallow-doctype-decl)"

  - id: WEB-SSTI
    category: A03:2021-Injection
    cwe: CWE-1336
    severity: high
    confidence: medium
    languages: ['*']
    pattern: '(?i)(render_template_string|Environment\([^)]*\)\.from_string|Template\s*\(\s*[a-z_$]|Twig[^\n]{0,30}createTemplate|Freemarker[^\n]{0,30}process|Velocity\.evaluate)'
    message: "模板由变量拼装(SSTI,常直接通向 RCE)"
    remediation: "模板字符串必须是常量;用户数据只作为渲染变量传入"

  - id: WEB-XSS-DOM
    category: A03:2021-Injection
    cwe: CWE-79
    severity: medium
    confidence: medium
    languages: ['*']
    pattern: '(?i)(\.innerHTML\s*=|\.outerHTML\s*=|document\.write(ln)?\s*\(|dangerouslySetInnerHTML|v-html\s*=|\[innerHTML\]\s*=|insertAdjacentHTML\s*\()'
    message: "危险的 DOM 写入点,数据若来自输入未过滤即 XSS"
    remediation: "用 textContent / 框架的安全插值;富文本走白名单净化(DOMPurify)"

  - id: WEB-XSS-REFLECT
    category: A03:2021-Injection
    cwe: CWE-79
    severity: medium
    confidence: medium
    languages: ['*']
    pattern: '(?i)(echo|print|printf|die|exit|<%=\s*|response\.write\s*\()\s*\(?[^\n]{0,40}(\$_(GET|POST|REQUEST|COOKIE)|request\.(args|form|params|query|body)|req\.(query|params|body)|getParameter)'
    message: "直接把请求参数回显到页面(反射型 XSS 信号)"
    remediation: "输出统一做 HTML 实体编码;配 CSP"

  - id: WEB-OPEN-REDIRECT
    category: A01:2021-Broken-Access-Control
    cwe: CWE-601
    severity: medium
    confidence: medium
    languages: ['*']
    pattern: '(?i)(res\.redirect\s*\(|Response\.Redirect\s*\(|sendRedirect\s*\(|header\s*\(\s*["'']Location:|Location\s*:\s*["'']?\s*\.?\s*\$|window\.location\s*=\s*[^;]{0,40}(params|input|\$_GET))'
    message: "跳转目标可能来自参数(开放重定向,常用于钓鱼 / 绕过校验)"
    remediation: "只允许相对路径或白名单域名"

  - id: WEB-HOST-HEADER-TRUST
    category: A05:2021-Security-Misconfiguration
    cwe: CWE-346
    severity: medium
    confidence: low
    languages: ['*']
    pattern: '(?i)(request|req)\.[^\n]{0,20}(headers|getHeader)[^\n]{0,40}(["'']|\[)host|\$_SERVER\[["'']HTTP_HOST'
    message: "使用 Host 头构造链接(密码重置投毒 / 缓存投毒)"
    remediation: "用固定配置的站点域名,不要信 Host 头"

  - id: WEB-MASS-ASSIGNMENT
    category: A01:2021-Broken-Access-Control
    cwe: CWE-915
    severity: medium
    confidence: low
    languages: ['*']
    pattern: '(?i)(Object\.assign\s*\(\s*[a-z_$][\w$]*\s*,\s*req\.(body|query)|\.update\s*\(\s*req\.body|\.create\s*\(\s*req\.body|update_attributes\s*\(\s*params|\.permit!\s*$|setattr\s*\([^\n]{0,40}(request|req)\.)'
    message: "把整个请求体批量赋给模型(可越权改 is_admin 等敏感字段)"
    remediation: "显式白名单字段;敏感字段禁由请求设置"

  - id: WEB-IDOR-SIGNAL
    category: A01:2021-Broken-Access-Control
    cwe: CWE-639
    severity: medium
    confidence: low
    languages: ['*']
    pattern: '(?i)(findById|get_object_or_404|\.first\(|SELECT[^\n]{0,80}WHERE\s+id\s*=|\.find\([^\n]{0,40}id\s*:)[^\n]{0,120}(params|query|args|request\.|\$_GET|input\()'
    message: "直接用请求里的 id 查数据,确认是否校验了归属(越权/IDOR 高发点)"
    remediation: "查询条件里带上当前用户/租户 ID,或查后做归属校验"

  - id: WEB-CSRF-SIGNAL
    category: A01:2021-Broken-Access-Control
    cwe: CWE-352
    severity: low
    confidence: low
    languages: ['*']
    pattern: '(?i)(@app\.(post|put|delete|patch)|@RequestMapping[^\n]{0,40}(POST|PUT|DELETE)|router\.(post|put|delete)|app\.(post|put|delete)\s*\([^\n]{0,60}(transfer|delete|update|admin|logout|pay|withdraw))'
    message: "存在状态变更接口,确认是否有 CSRF 防护 / SameSite"
    remediation: "校验 CSRF token 或改用 SameSite=Lax/Strict + Origin 校验"

  - id: WEB-JWT-ALG-NONE
    category: A07:2021-Identification-and-Authentication-Failures
    cwe: CWE-347
    severity: critical
    confidence: medium
    languages: ['*']
    pattern: '(?i)(algorithms?\s*[:=]\s*\[?\s*["'']none["'']|verify_signature["'']?\s*[:=]\s*(False|false)|verify\s*[:=]\s*(False|false)[^\n]{0,60}jwt|jwt\.decode\s*\([^\n]{0,80}(verify\s*[:=]\s*(False|false)|options\s*=\s*\{[^}]*verify_signature))'
    message: "JWT 校验被关闭或允许 alg=none(可伪造任意身份)"
    remediation: "强制固定算法白名单并始终验签"

  - id: WEB-WEAK-RANDOM-TOKEN
    category: A02:2021-Cryptographic-Failures
    cwe: CWE-338
    severity: medium
    confidence: medium
    languages: ['*']
    pattern: '(?i)(token|otp|reset[_\-]?code|session[_\-]?id|secret|salt|nonce|csrf|verify[_\-]?code)[A-Za-z0-9_]*\s*[:=][^\n]{0,40}(Math\.random|random\.(random|randint|choice|randrange)|\brand\s*\(|mt_rand|uniqid|microtime|time\s*\(\s*\)\s*\.\s*rand)'
    message: "安全令牌用弱随机数生成(可预测 → 爆破 / 越权)"
    remediation: "用 CSPRNG:secrets / crypto.randomBytes / SecureRandom / random_int / crypto/rand"

  - id: WEB-TIMING-UNSAFE-COMPARE
    category: A02:2021-Cryptographic-Failures
    cwe: CWE-208
    severity: low
    confidence: low
    languages: ['*']
    pattern: '(?i)(hmac|signature|digest|token|secret|password_hash)[A-Za-z0-9_]*\s*(==|!=)\s*(?!None|nil|null)'
    message: "敏感值用 == 直接比较(时序侧信道)"
    remediation: "用 hmac.compare_digest / crypto.timingSafeEqual 等常量时间比较"

  - id: WEB-SENSITIVE-LOG
    category: A09:2021-Security-Logging-and-Monitoring-Failures
    cwe: CWE-532
    severity: low
    confidence: medium
    languages: ['*']
    pattern: '(?i)(log(ger)?\.(debug|info|warning|error)|console\.(log|info|debug)|print|System\.out\.print)[^\n]{0,60}(password|passwd|pwd|secret|token|api[_-]?key|credit[_-]?card|cvv|id[_-]?card)'
    message: "日志里可能打印了敏感信息"
    remediation: "打码或干脆不打;日志系统加敏感字段过滤"

  - id: WEB-RESET-TOKEN-IN-RESPONSE
    category: A04:2021-Insecure-Design
    cwe: CWE-640
    severity: high
    confidence: low
    languages: ['*']
    pattern: '(?i)(reset|forgot)[_\-]?(token|code|link)[^\n]{0,60}(return|response|render|jsonify|json\.dumps|send)\b'
    message: "重置令牌 / 链接直接在响应里返回(任意人可重置他人密码)"
    remediation: "只通过邮件 / 短信等带外渠道下发"

  - id: WEB-RACE-CONDITION-PAYMENT
    category: A04:2021-Insecure-Design
    cwe: CWE-362
    severity: medium
    confidence: low
    languages: ['*']
    pattern: '(?i)(balance|stock|amount|quota|inventory)[^\n]{0,40}(-=\s*|\+\=\s*\w+(amount|qty))'
    message: "余额 / 库存的直接增减,确认是否有并发控制(超卖 / 重复扣款)"
    remediation: "数据库层面带条件更新(UPDATE ... WHERE balance >= x),或加锁 / 幂等键"

  # ========================================================================= #
  # Python
  # ========================================================================= #

  - id: PY-EVAL-EXEC
    category: A03:2021-Injection
    cwe: CWE-95
    severity: high
    confidence: medium
    languages: [python]
    pattern: '(?i)(?<![\w.])(eval|exec)\s*\('
    message: "eval/exec 执行动态代码"
    remediation: "用 ast.literal_eval 或显式解析;绝不执行拼接出来的代码"

  - id: PY-OS-SYSTEM
    category: A03:2021-Injection
    cwe: CWE-78
    severity: high
    confidence: medium
    languages: [python]
    pattern: '(?i)\bos\.(system|popen|spawn[lv]?[pe]?)\s*\('
    message: "os.system / popen 走 shell"
    remediation: "改用 subprocess 的参数列表形式"

  - id: PY-SQL-RAW
    category: A03:2021-Injection
    cwe: CWE-89
    severity: high
    confidence: medium
    languages: [python]
    pattern: '(?i)(\.raw\s*\(\s*f?["'']|cursor\.execute\s*\(|executemany\s*\(|\.execute\s*\(\s*f["'']|\.extra\s*\(|text\s*\(\s*f["''])'
    message: "原始 SQL 执行入口,确认参数是否拼接"
    remediation: "用占位符 %s / :name 传参"

  - id: PY-PICKLE-LOAD
    category: A08:2021-Software-and-Data-Integrity-Failures
    cwe: CWE-502
    severity: high
    confidence: high
    languages: [python]
    pattern: '(?i)(pickle|cPickle|dill|shelve|marshal)\.loads?\s*\('
    message: "不安全反序列化"
    remediation: "换 JSON;必须用时加 HMAC 校验来源"

  - id: PY-YAML-LOAD-UNSAFE
    category: A08:2021-Software-and-Data-Integrity-Failures
    cwe: CWE-502
    severity: high
    confidence: medium
    languages: [python]
    pattern: '(?i)yaml\.load\s*\((?!\s*[^)]{0,80}(Safe|safe)_?Loader)'
    message: "yaml.load 未指定 SafeLoader"
    remediation: "用 yaml.safe_load"

  - id: PY-TEMPLATE-INJECTION
    category: A03:2021-Injection
    cwe: CWE-1336
    severity: high
    confidence: medium
    languages: [python]
    pattern: '(?i)(render_template_string|from_string|jinja2\.Template|Template\s*\()'
    message: "动态模板渲染"
    remediation: "模板固定,数据只作为变量"

  - id: PY-REQUESTS-USER-URL
    category: A10:2021-Server-Side-Request-Forgery
    cwe: CWE-918
    severity: medium
    confidence: low
    languages: [python]
    pattern: '(?i)(requests\.(get|post|put|patch|delete|head|request)|urllib\.request\.urlopen|httpx\.(get|post|stream))\s*\(\s*(f["'']|["'']\s*\+|[a-z_][\w\.\[\]"'']*\s*[+%]|[a-z_][\w\.\[\]"'']*\s*\))'
    message: "请求 URL 来自变量(SSRF 信号)"
    remediation: "白名单目标域名;禁止访问内网与元数据地址"

  - id: PY-OPEN-USER-INPUT
    category: A01:2021-Broken-Access-Control
    cwe: CWE-22
    severity: medium
    confidence: low
    languages: [python]
    pattern: '(?i)\b(open|Path|shutil\.copy\w*|shutil\.move)\s*\(\s*(?!["''])(?!f?["''])[a-z_][\w\.\[\]"'']*'
    message: "文件操作参数是变量,确认是否来自用户输入"
    remediation: "校验并规范化路径,限制在基目录内"

  - id: PY-SUBPROCESS-SHELL
    category: A03:2021-Injection
    cwe: CWE-78
    severity: high
    confidence: high
    languages: [python]
    pattern: '(?i)subprocess\.[a-zA-Z_]+\([^)]*shell\s*=\s*True'
    message: "subprocess 开了 shell"
    remediation: "去掉 shell=True,用列表传参"

  - id: PY-DEBUG-RUN
    category: A05:2021-Security-Misconfiguration
    cwe: CWE-489
    severity: medium
    confidence: medium
    languages: [python]
    pattern: '(?i)(app\.run\s*\([^)]*debug\s*=\s*True|DEBUG\s*=\s*True|run\s*\([^)]*debug\s*=\s*True)'
    message: "Flask/Django 调试模式打开(Werkzeug 调试器可 RCE)"
    remediation: "生产环境关闭"

  - id: PY-TLS-VERIFY-OFF
    category: A02:2021-Cryptographic-Failures
    cwe: CWE-295
    severity: medium
    confidence: high
    languages: [python]
    pattern: '(?i)(verify\s*=\s*False|ssl\._create_unverified_context|ssl\.CERT_NONE|check_hostname\s*=\s*False)'
    message: "关闭 TLS 校验"
    remediation: "恢复校验"

  - id: PY-MD5-PASSWORD
    category: A02:2021-Cryptographic-Failures
    cwe: CWE-916
    severity: high
    confidence: medium
    languages: [python]
    pattern: '(?i)(hashlib\.(md5|sha1)\s*\(|md5\s*\(\s*[^)]{0,40}(pass|pwd|secret))'
    message: "弱哈希用于口令"
    remediation: "改用 bcrypt / argon2(passlib)"

  - id: PY-DJANGO-CSRF-EXEMPT
    category: A01:2021-Broken-Access-Control
    cwe: CWE-352
    severity: medium
    confidence: high
    languages: [python]
    pattern: '(?i)@csrf_exempt'
    message: "该视图豁免了 CSRF 校验"
    remediation: "去掉;确需豁免(如 webhook)要做签名校验"

  - id: PY-JINJA-AUTOESCAPE-OFF
    category: A03:2021-Injection
    cwe: CWE-79
    severity: medium
    confidence: medium
    languages: [python]
    pattern: '(?i)(autoescape\s*=\s*False|\|\s*safe\b|mark_safe\s*\(|Markup\s*\(|format_html\s*\()'
    message: "关闭了模板自动转义(XSS 风险)"
    remediation: "保持自动转义;必须渲染 HTML 时先净化"

  - id: PY-SQL-FSTRING
    category: A03:2021-Injection
    cwe: CWE-89
    severity: high
    confidence: medium
    languages: [python]
    pattern: '(?i)(execute|executemany|raw)\s*\(\s*f["'']'
    message: "f-string 直接拼进 SQL"
    remediation: "参数化查询"

  - id: PY-TAR-EXTRACT
    category: A08:2021-Software-and-Data-Integrity-Failures
    cwe: CWE-22
    severity: medium
    confidence: medium
    languages: [python]
    pattern: '(?i)(tarfile\.\w+\.?\w*\.?(extractall|extract)\s*\(|zipfile\.\w+\.extractall\s*\()'
    message: "解压不可信压缩包(路径穿越 / Zip Slip)"
    remediation: "解压前逐条校验成员路径,过滤 .. 与绝对路径"

  - id: PY-SECRETS-VIA-ARGS
    category: A07:2021-Identification-and-Authentication-Failures
    cwe: CWE-214
    severity: low
    confidence: low
    languages: [python]
    pattern: '(?i)add_argument\s*\(\s*["''][-_]{0,2}(password|secret|token|api[_-]?key)["'']'
    message: "命令行参数传密钥(会进进程列表 / shell history)"
    remediation: "改用环境变量 / 交互输入 / 文件描述符"

  # ========================================================================= #
  # JavaScript / TypeScript
  # ========================================================================= #

  - id: JS-EVAL
    category: A03:2021-Injection
    cwe: CWE-95
    severity: high
    confidence: medium
    languages: [javascript]
    pattern: '(?i)(?<![\w.$])(eval|Function)\s*\('
    message: "eval / new Function 执行动态代码"
    remediation: "去掉;必须解析表达式时用受限的解析器"

  - id: JS-CHILD-PROCESS
    category: A03:2021-Injection
    cwe: CWE-78
    severity: high
    confidence: medium
