# 硬编码凭据 / 密钥检测规则
#
# 字段说明:
#   id            唯一编号
#   pattern       Python 正则。要忽略大小写就写在开头:(?i)...
#   value_group   取值用的捕获组;给了它就只对该组判占位符和熵
#   entropy       可选,对取值算香农熵,低于该值视为噪音跳过
#   severity      critical | high | medium | low | info
#   confidence    high | medium | low
#   message       命中提示
#   remediation   修复建议
#
# 注意:命中只是"疑似",务必结合上下文确认(常量、示例、已失效的 key 都是假阳性)。

rules:
  - id: SEC-AWS-ACCESS-KEY
    pattern: '(?<![A-Z0-9])(AKIA|ASIA)[0-9A-Z]{16}(?![A-Z0-9])'
    severity: critical
    confidence: high
    category: A07:2021-Identification-and-Authentication-Failures
    cwe: CWE-798
    message: "疑似 AWS Access Key ID 硬编码"
    remediation: "立即在 IAM 里吊销该 key,改用 IAM Role / 环境变量 / KMS"

  - id: SEC-AWS-SECRET
    pattern: '(?i)aws.{0,20}(secret|private)[_a-z]*\s*[:=]\s*["'']([A-Za-z0-9/+=]{40})["'']'
    value_group: 2
    severity: critical
    confidence: high
    cwe: CWE-798
    message: "疑似 AWS Secret Access Key 硬编码"
    remediation: "吊销并轮换,改用 IAM Role / Secrets Manager"

  - id: SEC-ALIYUN-AK
    pattern: '(?<![A-Za-z0-9])LTAI[0-9A-Za-z]{12,20}(?![A-Za-z0-9])'
    severity: critical
    confidence: medium
    cwe: CWE-798
    message: "疑似阿里云 AccessKey ID"
    remediation: "吊销并轮换,改用 RAM 角色 / KMS"

  - id: SEC-TENCENT-AK
    pattern: '(?<![A-Za-z0-9])AKID[0-9A-Za-z]{28,36}(?![A-Za-z0-9])'
    severity: critical
    confidence: medium
    cwe: CWE-798
    message: "疑似腾讯云 SecretId"
    remediation: "吊销并轮换,改用 CAM 角色"

  - id: SEC-GOOGLE-API
    pattern: '(?<![A-Za-z0-9_])AIza[0-9A-Za-z\-_]{35}(?![A-Za-z0-9_])'
    severity: high
    confidence: high
    cwe: CWE-798
    message: "疑似 Google API Key"
    remediation: "在 GCP 控制台吊销并限制来源"

  - id: SEC-GITHUB-TOKEN
    pattern: '(?<![A-Za-z0-9_])(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,})(?![A-Za-z0-9_])'
    severity: critical
    confidence: high
    cwe: CWE-798
    message: "疑似 GitHub Token"
    remediation: "立即在 Settings → Developer settings 里撤销"

  - id: SEC-SLACK-TOKEN
    pattern: '(?<![A-Za-z0-9_])xox[baprs]-[A-Za-z0-9\-]{10,}'
    severity: high
    confidence: high
    cwe: CWE-798
    message: "疑似 Slack Token"
    remediation: "撤销该 token 并轮换"

  - id: SEC-STRIPE-KEY
    pattern: '(?<![A-Za-z0-9_])(sk|rk)_live_[0-9A-Za-z]{16,}'
    severity: critical
    confidence: high
    cwe: CWE-798
    message: "疑似 Stripe 生产密钥"
    remediation: "在 Stripe 后台滚动密钥"

  - id: SEC-OPENAI-KEY
    pattern: '(?<![A-Za-z0-9_\-])sk-[A-Za-z0-9]{20,}(?![A-Za-z0-9])'
    severity: high
    confidence: medium
    cwe: CWE-798
    message: "疑似 OpenAI 风格 API Key"
    remediation: "吊销并轮换;改用服务端代理,不要进前端"

  - id: SEC-ANTHROPIC-KEY
    pattern: '(?<![A-Za-z0-9_\-])sk-ant-[A-Za-z0-9\-_]{20,}'
    severity: high
    confidence: high
    cwe: CWE-798
    message: "疑似 Anthropic API Key"
    remediation: "吊销并轮换"

  - id: SEC-PRIVATE-KEY-BLOCK
    pattern: '-----BEGIN\s+(RSA|EC|DSA|OPENSSH|PGP|ENCRYPTED)?\s*PRIVATE KEY-----'
    severity: critical
    confidence: high
    category: A02:2021-Cryptographic-Failures
    cwe: CWE-321
    message: "私钥内容被写进仓库"
    remediation: "视为已泄露:吊销、重新签发,并从版本历史里清除"

  - id: SEC-JWT-TOKEN
    pattern: '(?<![A-Za-z0-9_\-])eyJ[A-Za-z0-9_\-]{8,}\.eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}'
    severity: medium
    confidence: medium
    cwe: CWE-798
    message: "疑似硬编码 JWT(可能是已签发的真实令牌)"
    remediation: "确认是否含敏感载荷;令牌应短期有效且不落库"

  - id: SEC-JWT-SECRET-ASSIGN
    pattern: '(?i)(jwt[_\-]?(secret|key)|secret[_\-]?key|signing[_\-]?key)\s*[:=]\s*["'']([^"'']{12,64})["'']'
    value_group: 2
    entropy: 3.0
    severity: critical
    confidence: medium
    category: A02:2021-Cryptographic-Failures
    cwe: CWE-798
    message: "疑似 JWT / 签名密钥硬编码(可伪造任意令牌)"
    remediation: "移到环境变量或 KMS,并立即轮换(轮换会让旧令牌失效)"

  - id: SEC-DB-URI
    pattern: '(?i)\b(mysql|mariadb|postgres|postgresql|mongodb(\+srv)?|redis|amqp|mssql|oracle)://[^:/\s"'']+:[^@\s"'']{3,}@'
    severity: high
    confidence: high
    cwe: CWE-798
    message: "数据库 / 消息队列连接串含明文口令"
    remediation: "用环境变量或密钥管理;限制该账号权限与来源 IP"

  - id: SEC-GENERIC-ASSIGN
    pattern: '(?i)\b(password|passwd|pwd|secret|token|api[_-]?key|apikey|access[_-]?key|private[_-]?key|auth[_-]?token|client[_-]?secret|credential)\b\s*[:=]\s*["'']([^"'']{8,80})["'']'
    value_group: 2
    entropy: 3.2
    severity: medium
    confidence: low
    cwe: CWE-798
    message: "疑似密码 / 密钥赋值(需人工确认是否为真实凭据)"
    remediation: "改为从环境变量或密钥服务读取;确认后轮换"

  - id: SEC-HIGH-ENTROPY-VALUE
    pattern: '(?i)(key|token|secret|pass|auth|cred|salt|sign|nonce|cipher)[A-Za-z0-9_]*\s*[:=]\s*["'']([A-Za-z0-9+/=_\-]{24,})["'']'
    value_group: 2
    entropy: 4.2
    severity: medium
    confidence: low
    cwe: CWE-798
    message: "高熵字符串赋值给密钥类变量名"
    remediation: "确认来源;真实的应移出版本库"

  - id: SEC-BASIC-AUTH-URL
    pattern: '(?i)https?://[^/\s:@]{1,64}:[^/\s:@]{3,64}@[a-z0-9.\-]+'
    severity: high
    confidence: medium
    cwe: CWE-798
    message: "URL 里内嵌了 HTTP Basic 凭据"
    remediation: "改用请求头 / 凭据存储,并轮换该账号口令"

  - id: SEC-PRIVATE-IP-BASIC-AUTH
    pattern: '(?i)(Authorization|Basic)\s*[:=]\s*["'']Basic\s+[A-Za-z0-9+/=]{16,}["'']'
    severity: medium
    confidence: medium
    cwe: CWE-798
    message: "硬编码 Basic 认证头"
    remediation: "改为运行时注入,并轮换凭据"

  - id: SEC-SENDGRID-MAILGUN
    pattern: '(?<![A-Za-z0-9_])(SG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}|key-[0-9a-f]{32})(?![A-Za-z0-9])'
    severity: high
    confidence: medium
    cwe: CWE-798
    message: "疑似邮件服务 API Key(SendGrid / Mailgun)"
    remediation: "吊销并轮换,限制发送权限"

  - id: SEC-TWILIO-SID
    pattern: '(?<![A-Za-z0-9])AC[0-9a-f]{32}(?![A-Za-z0-9])'
    severity: medium
    confidence: low
    cwe: CWE-798
    message: "疑似 Twilio Account SID"
    remediation: "配合 auth token 可发短信/打电话,确认后轮换"

  - id: SEC-ENV-ASSIGN
    file_globs: ['.env', '.env.*', '*.env', '*.properties', '*.ini', '*.cfg', '*.conf',
                 '*.yaml', '*.yml', '*.json', '*.sh', '*.tf', 'Dockerfile*', '*.service']
    pattern: '(?m)^\s*["'']?([A-Za-z_][A-Za-z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|PASSWD|PWD|CREDENTIAL|AUTH|SALT)[A-Za-z0-9_]*)["'']?\s*[:=]\s*["'']?([^\s"''#,;]{8,120})["'']?\s*$'
    value_group: 2
    severity: high
    confidence: medium
    cwe: CWE-798
    message: "配置文件里以明文赋值给密钥类字段(无引号写法)"
    remediation: "改为从环境变量 / 密钥服务注入,并轮换该凭据"
